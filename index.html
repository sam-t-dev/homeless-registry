<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Homeless Registry - Live Counts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mode-toggle" style="position: fixed; top: 20px; right: 20px; background: var(--card-bg); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem;">
    <span id="modeLight" style="display: inline; opacity: 0.7;">☾ Light</span>
    <span id="modeDark" style="display: none; opacity: 0.7;">☀ Dark</span>
  </div>

  <header>
    <h1>Anonymous Homeless Registry</h1>
    <p>Live aggregate counts of homelessness by city and situation</p>
  </header>

  <main>
    <!-- Map section - front and center, takes up most of the screen -->
    <section class="map-section">
      <div id="map" style="width: 100%; height: 70vh; position: relative;"></div>
      <div class="map-legend" style="position: absolute; bottom: 20px; left: 20px; background: var(--card-bg); padding: 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 1000; font-size: 0.85rem;">
        <strong>Legend</strong><br>
        <i style="background: #3498db; width: 16px; height: 16px; display: inline-block; margin-right: 4px;"></i> Rough sleeping<br>
        <i style="background: #9b59b6; width: 16px; height: 16px; display: inline-block; margin-right: 4px;"></i> Vehicle<br>
        <i style="background: #e67e22; width: 16px; height: 16px; display: inline-block; margin-right: 4px;"></i> Couch surfing<br>
        <i style="background: #95a5a6; width: 16px; height: 16px; display: inline-block; margin-right: 4px;"></i> Other
      </div>
    </section>

    <!-- Right sidebar - countries/cities/needs -->
    <section class="sidebar" style="margin-top: -70vh; padding: 1rem; max-height: 70vh; overflow-y: auto; direction: ltr;">
      <div class="timeline-selector" style="margin-bottom: 1rem; padding: 0.5rem; background: var(--card-bg); border-radius: 6px; font-size: 0.85rem;">
        <strong>Timeline:</strong> 
        <select id="timelineSelect" style="margin-left: 0.5rem; padding: 0.3rem 0.5rem;">
          <option value="daily">Daily</option>
          <option value="weekly" selected>Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
          <option value="5year">5 Year</option>
        </select>
      </div>

      <div class="section" style="margin-bottom: 1rem;">
        <h3>Top Countries</h3>
        <div id="topCountries" style="font-size: 0.85rem;"></div>
      </div>

      <div class="section" style="margin-bottom: 1rem;">
        <h3>Top Cities</h3>
        <div id="topCities" style="font-size: 0.85rem;"></div>
      </div>

      <div class="section" style="margin-bottom: 1rem;">
        <h3>Top Needs</h3>
        <div id="topNeeds" style="font-size: 0.85rem;"></div>
      </div>

      <!-- Breadcrumb area -->
      <div id="breadcrumb" style="margin-top: 1rem; font-size: 0.8rem; color: var(--muted-color);"></div>
    </section>
  </main>

  <footer>
    &copy; 2026 Anonymous Homeless Registry | <a href="privacy-policy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a>
  </footer>

  <script>
    // Initialize data from localStorage
    let records = [];
    const storedRecords = localStorage.getItem('registryRecords');
    if (storedRecords) {
      records = JSON.parse(storedRecords);
    }
    
    // Sample global data for demonstration (in production, fetched from scraper)
    const sampleGlobalData = {
      countries: [
        {name: "United States", count: 580000, change: -12000, isNegative: true},
        {name: "India", count: 450000, change: 8000, isNegative: false},
        {name: "Brazil", count: 220000, change: -5000, isNegative: true},
        {name: "France", count: 150000, change: 3000, isNegative: false},
        {name: "Australia", count: 110000, change: -2000, isNegative: true}
      ],
      cities: {
        "United States": [
          {name: "New York", count: 75000, change: -3000, isNegative: true},
          {name: "Los Angeles", count: 52000, change: -2000, isNegative: true}
        ],
        "India": [
          {name: "Mumbai", count: 180000, change: 5000, isNegative: false},
          {name: "Delhi", count: 150000, change: 4000, isNegative: false}
        ]
      },
      needs: ["food", "shelter", "medical", "employment", "legal"],
      timelineFormats: {
        daily: "Last 24 hours",
        weekly: "Last 7 days",
        monthly: "Last 30 days",
        yearly: "Last 365 days",
        5year: "Last 5 years"
      }
    };
    
    // DOM Elements
    const mapDiv = document.getElementById('map');
    const totalCount = document.getElementById('totalCount');
    const uniqueCities = document.querySelector('.count-card:nth(1) .number');
    const activeSituations = document.querySelector('.count-card:nth(2) .number');
    const timelineSelect = document.getElementById('timelineSelect');
    const topCountriesDiv = document.getElementById('topCountries');
    const topCitiesDiv = document.getElementById('topCities');
    const topNeedsDiv = document.getElementById('topNeeds');
    const breadcrumbDiv = document.getElementById('breadcrumb');
    
    // Render global data
    function renderGlobalData(timeline = 'weekly') {
      const format = sampleGlobalData.timelineFormats[timeline] || 'Last 7 days';
      topCountriesDiv.innerHTML = '';
      topCitiesDiv.innerHTML = '';
      topNeedsDiv.innerHTML = '';
      
      // Top countries
      sampleGlobalData.countries.slice(0, 10).forEach((country, i) => {
        const changeClass = country.isNegative ? 'negative' : 'positive';
        const changeText = country.isNegative ? '↓' : '↑';
        const countryDiv = document.createElement('div');
        countryDiv.style.cssText = `margin: 0.2rem 0; padding: 0.2rem; cursor: pointer; border-radius: 4px; transition: background 0.2s;`;
        countryDiv.title = country.name;
        countryDiv.innerHTML = `<strong style="color: var(--primary-color);">${country.name}</strong> <span style="color: var(${country.isNegative ? '--accent-color' : '--secondary-color')};">${country.count}</span> <span class="${changeClass}">${changeText}${Math.abs(country.change)}</span>`;
        countryDiv.onclick = () => showCountryPage(country.name);
        topCountriesDiv.appendChild(countryDiv);
      });
      
      // Top cities (for first country shown)
      const firstCountry = sampleGlobalData.countries[0].name;
      const cities = sampleGlobalData.cities[firstCountry] || [];
      topCitiesDiv.innerHTML = `<em>Select a country to see top cities</em>`;
      if (cities.length > 0) {
        topCitiesDiv.innerHTML = '';
        cities.slice(0, 5).forEach(city => {
          const cityDiv = document.createElement('div');
          cityDiv.style.cssText = `margin: 0.2rem 0; padding: 0.2rem; cursor: pointer; border-radius: 4px;`;
          cityDiv.title = city.name;
          cityDiv.innerHTML = `<strong>${city.name}</strong> <span>${city.count}</span> <span class="${city.isNegative ? 'negative' : 'positive'}">${city.isNegative ? '↓' : '↑'}${Math.abs(city.change)}</span>`;
          cityDiv.onclick = () => showCityPage(firstCountry, city.name);
          topCitiesDiv.appendChild(cityDiv);
        });
      }
      
      // Top needs
      topNeedsDiv.innerHTML = '<em>Needs data available per record submission</em>';
    }
    
    function showCountryPage(countryName) {
      // Update breadcrumb
      breadcrumbDiv.innerHTML = `<a href="javascript:homePage()">World</a> > ${countryName}`;
      
      // Hide sidebar content, show country-focused content
      topCountriesDiv.innerHTML = '';
      topCitiesDiv.innerHTML = '';
      
      // Show top cities for this country
      const cities = sampleGlobalData.cities[countryName] || [];
      topCitiesDiv.innerHTML = '';
      if (cities.length > 0) {
        topCitiesDiv.style.display = 'block';
        cities.slice(0, 5).forEach(city => {
          const isNeg = city.change < 0;
          const cityDiv = document.createElement('div');
          cityDiv.style.cssText = `margin: 0.3rem 0; padding: 0.3rem; background: var(--bg-color); border-radius: 4px; cursor: pointer;`;
          cityDiv.innerHTML = `<strong>${city.name}</span> <span>${city.count}</span> <span class="${isNeg ? 'negative' : 'positive'}">${city.isNegative ? '↓' : '↑'}${Math.abs(city.change)}</span>`;
          cityDiv.onclick = () => showCityPage(countryName, city.name);
          topCitiesDiv.appendChild(cityDiv);
        });
      } else {
        topCitiesDiv.style.display = 'none';
      }
      
      // Show states (placeholder - would be more detailed in full implementation)
      topNeedsDiv.innerHTML = `<strong>States in ${countryName}:</strong> Data being loaded...`;
      
      // Update headline
      document.querySelector('h1').textContent = `Homelessness in ${countryName}`;
    }
    
    function showCityPage(countryName, cityName) {
      breadcrumbDiv.innerHTML = `<a href="javascript:homePage()">World</a> > ${countryName} > ${cityName}`;
      document.querySelector('h1').textContent = `Homelessness in ${cityName}, ${countryName}`;
      topCountriesDiv.innerHTML = `<em>Click a country to return to global view</em>`;
      topCitiesDiv.innerHTML = `<em>Detailed city statistics loading...</em>`;
      topNeedsDiv.innerHTML = `<em>Needs: Data per submission records</em>`;
    }
    
    function homePage() {
      breadcrumbDiv.innerHTML = '';
      document.querySelector('h1').textContent = `Anonymous Homeless Registry`;
      renderGlobalData(timelineSelect.value);
      topCitiesDiv.style.display = 'none';
    }
    
    // Initialize on load
    renderGlobalData('weekly');
    
    // Timeline change handler
    timelineSelect.addEventListener('change', () => renderGlobalData(timelineSelect.value));
    
    // Country click handler
    document.querySelectorAll('#topCountries div').forEach(el => {
      el.onclick = (e) => {
        const countryName = el.querySelector('strong').textContent;
        showCountryPage(countryName);
      };
    });
    
    // City click handler
    document.querySelectorAll('#topCities div').forEach(el => {
      el.onclick = (e) => {
        const countryName = el.previousElementSibling ? 
          el.previousElementSibling.textContent.split('>')[1] || 'United States' : 
          'United States';
        const cityName = el.querySelector('strong').textContent;
        showCityPage(countryName, cityName);
      };
    });
  </script>
  
  <script src="app.js"></script>
</body>
</html>
