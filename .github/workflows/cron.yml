name: Update Anonymous Registry Aggregates

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows manual re-dispatch to change schedule if needed

jobs:
  update-aggregates:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all branches including gh-pages
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate aggregate index
        run: node generate-index.js
        env:
          # No secret needed - this is all public aggregate data
          GIT_AUTHOR_NAME: "Anonymous Registry Bot"
          GIT_AUTHOR_EMAIL: "registry-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "Anonymous Registry Bot"
          GIT_COMMITTER_EMAIL: "registry-bot@users.noreply.github.com"

      - name: Check if index.html changed
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated index.html
        if: steps.check-changes.outputs.no_changes == 'false'
        run: |
          git config user.name "Anonymous Registry Bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update aggregate counts [skip ci]"
          git push origin HEAD:gh-pages